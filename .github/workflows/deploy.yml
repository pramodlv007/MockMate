# ─────────────────────────────────────────────────────────────────────────────
# MockMate — CI/CD (GitHub Actions → GHCR → k3s on Oracle Cloud)
#
# Every commit, any branch:
#   test    — backend unit tests + frontend build
#   images  — backend image smoke-tested against Postgres, then backend + frontend
#             built for linux/amd64 + linux/arm64 and pushed to GHCR tagged with the git SHA
# Push to main, once the cluster exists (repo variable DOMAIN set):
#   deploy  — joins the tailnet, `helm upgrade` to that SHA, HTTPS smoke test
#
# Secrets:   KUBECONFIG_B64 (base64 kubeconfig, server https://mockmate-k3s:6443),
#            TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET (Tailscale OAuth client, tag:ci),
#            VITE_GOOGLE_CLIENT_ID (optional, public client id baked into the frontend)
# Variables: DOMAIN, LETSENCRYPT_EMAIL
# App secrets (DB, Gemini, AWS) live only in the cluster's mockmate-secrets Secret.
# ─────────────────────────────────────────────────────────────────────────────

name: MockMate CI/CD

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a production deploy halfway through
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GHCR names must be lowercase; repository_owner (pramodlv007) already is
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mockmate-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mockmate-frontend

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && python -m pytest tests rubric_eval -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/mockmate
          helm lint deploy/helm/mockmate -f deploy/helm/mockmate/values-prod.yaml \
            --set ingress.host=ci.example.com --set certManager.email=ci@example.com

  images:
    name: Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mockmate
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mockmate_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mockmate" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # emulates arm64 for the Oracle Ampere node
      - uses: docker/setup-buildx-action@v3

      # Smoke-test the amd64 build first; a multi-arch build can't be loaded into the local daemon.
      - name: Build backend (amd64, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.consolidated
          load: true
          tags: mockmate-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test backend image
        run: |
          docker run -d --name smoke --network host mockmate-backend:smoke
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok"'
          curl -sf localhost:8000/rubric/health | grep -q '"ok"'
          curl -sf localhost:8000/metrics/ | grep -q mockmate_http_request_duration_seconds
          # a real DB write catches schema drift (the old signup 500)
          curl -sf -X POST localhost:8000/auth/signup -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-${GITHUB_RUN_ID}@example.com\",\"password\":\"Passw0rd!x\",\"full_name\":\"CI\"}" \
            | grep -q access_token
          # the worker entrypoint must at least import
          docker run --rm --entrypoint python mockmate-backend:smoke -c "import services.evaluation.queue as q; print(q.WorkerSettings.functions)"
          echo "Smoke test passed"
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke --tail 80 || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.consolidated
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to k3s
    needs: images
    # DOMAIN is set as a repo variable only once the cluster is up, so main doesn't fail before then.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DOMAIN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The k3s API (6443) is only reachable on the tailnet; this runner joins it for the job.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes

      # Helm rolls the pods; --wait + --atomic roll back automatically if new pods never get ready.
      - name: Helm upgrade
        run: |
          helm upgrade --install mockmate deploy/helm/mockmate -n mockmate --create-namespace \
            -f deploy/helm/mockmate/values.yaml -f deploy/helm/mockmate/values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --set ingress.host=${{ vars.DOMAIN }} \
            --set certManager.email=${{ vars.LETSENCRYPT_EMAIL }} \
            --wait --atomic --timeout 10m

      - name: Smoke test (HTTPS)
        run: |
          for i in $(seq 1 12); do
            curl -sf https://${{ vars.DOMAIN }}/health | grep -q '"ok"' && break
            sleep 10
          done
          curl -sf https://${{ vars.DOMAIN }}/health | grep -q '"ok"'
          curl -sf https://${{ vars.DOMAIN }}/rubric/health | grep -q '"ok"'
          [ "$(curl -so /dev/null -w '%{http_code}' https://${{ vars.DOMAIN }}/)" = "200" ]
          [ "$(curl -so /dev/null -w '%{http_code}' http://${{ vars.DOMAIN }}/)" = "301" ]

      - name: Summary
        if: always()
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | https://${{ vars.DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Images | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
