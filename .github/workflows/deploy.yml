# ─────────────────────────────────────────────────────────────────────────────
# MockMate — CI/CD (GitHub Actions → GHCR → AWS EC2)
#
# Every commit, any branch:
#   test   — backend unit tests + frontend build
#   image  — build the backend Docker image, smoke-test it against Postgres,
#            push it to ghcr.io tagged with the commit SHA
# Push to main only:
#   deploy — EC2 pulls that exact tested image, swaps the container,
#            rolls back to the previous image if the health check fails
#
# Required GitHub Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, VITE_API_URL
# The registry login uses the built-in GITHUB_TOKEN; no extra secret needed.
# EC2 keeps its runtime config in ~/MockMate/.env (never baked into the image).
# ─────────────────────────────────────────────────────────────────────────────

name: MockMate CI/CD

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a production deploy halfway through
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GHCR names must be lowercase; repository_owner (pramodlv007) already is
  IMAGE: ghcr.io/${{ github.repository_owner }}/mockmate-backend:${{ github.sha }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && python -m pytest rubric_eval -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mockmate
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mockmate_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mockmate" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.consolidated
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok"'
          curl -sf localhost:8000/rubric/health | grep -q '"ok"'
          # a real DB write catches schema drift (the old signup 500)
          curl -sf -X POST localhost:8000/auth/signup -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-${GITHUB_RUN_ID}@example.com\",\"password\":\"Passw0rd!x\",\"full_name\":\"CI\"}" \
            | grep -q access_token
          echo "Smoke test passed"
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke --tail 80 || true

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync frontend and nginx config
        run: |
          SSH="ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no"
          rsync -az --delete -e "$SSH" frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/MockMate/frontend/dist/
          scp -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no nginx/mockmate.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/mockmate.conf

      - name: Deploy backend container
        run: |
          SSH="ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          # token goes over stdin, never on the remote command line; it expires when this job ends
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "IMAGE=$IMAGE bash -s" << 'ENDSSH'
          set -e
          cd ~/MockMate

          # certbot rewrites the nginx config once SSL is on; only install ours before that
          if [ ! -f /etc/letsencrypt/live/*/fullchain.pem ]; then
            sudo cp /tmp/mockmate.conf /etc/nginx/conf.d/mockmate.conf
          fi
          sudo nginx -t

          echo "==> Pulling $IMAGE"
          docker pull "$IMAGE"
          docker logout ghcr.io

          PREV=$(docker inspect --format '{{.Config.Image}}' mockmate 2>/dev/null || true)
          run() { docker run -d --name mockmate --env-file .env -p 8000:8000 --restart unless-stopped "$1"; }
          healthy() {
            for i in $(seq 1 15); do
              curl -sf localhost:8000/health | grep -q '"ok"' && return 0
              sleep 5
            done
            return 1
          }

          docker rm -f mockmate 2>/dev/null || true
          run "$IMAGE"
          if ! healthy; then
            echo "ERROR: new image unhealthy"
            docker logs mockmate --tail 50
            docker rm -f mockmate
            if [ -n "$PREV" ]; then
              run "$PREV"
              healthy && echo "Rolled back to $PREV"
            fi
            exit 1
          fi

          docker image prune -af   # old images stay in GHCR, re-pull by SHA to roll back by hand
          sudo systemctl reload nginx
          echo "==> Deployed $IMAGE"
          ENDSSH

      - name: Smoke test
        run: |
          curl -sf http://${{ secrets.EC2_HOST }}/health | grep -q '"ok"'
          [ "$(curl -so /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }}/)" = "200" ]
          curl -sf http://${{ secrets.EC2_HOST }}/rubric/health | grep -q '"ok"'

      - name: Summary
        if: always()
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | http://${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
