# ─────────────────────────────────────────────────────────────────────────────
# MockMate — CI/CD (GitHub Actions → GHCR → AWS EC2)
#
# Every commit, any branch:
#   test   — backend unit tests + frontend build
#   image  — build the backend Docker image, smoke-test it against Postgres,
#            push it to ghcr.io tagged with the commit SHA
# Push to main only:
#   deploy — EC2 pulls that exact tested image, swaps the container,
#            rolls back to the previous image if the health check fails
#
# Required GitHub Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, VITE_API_URL
# Optional: VITE_GOOGLE_CLIENT_ID (Google sign-in button; backend also needs GOOGLE_CLIENT_ID in EC2 .env)
#           SMTP_PASSWORD (+ SMTP_HOST, SMTP_USER for a relay such as Brevo): help and review emails; Gmail if only the password is set
# The registry login uses the built-in GITHUB_TOKEN; no extra secret needed.
# EC2 keeps its runtime config in ~/MockMate/.env (never baked into the image).
# ─────────────────────────────────────────────────────────────────────────────

name: MockMate CI/CD

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a production deploy halfway through
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GHCR names must be lowercase; repository_owner (pramodlv007) already is
  IMAGE: ghcr.io/${{ github.repository_owner }}/mockmate-backend:${{ github.sha }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && python -m pytest tests rubric_eval -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mockmate
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mockmate_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mockmate" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.consolidated
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name smoke --network host "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok"'
          curl -sf localhost:8000/rubric/health | grep -q '"ok"'
          # a real DB write catches schema drift (the old signup 500)
          curl -sf -X POST localhost:8000/auth/signup -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci-${GITHUB_RUN_ID}@example.com\",\"password\":\"Passw0rd!x\",\"full_name\":\"CI\",\"accept_privacy\":true}" \
            | grep -q access_token
          echo "Smoke test passed"
      - name: Container logs on failure
        if: failure()
        run: docker logs smoke --tail 80 || true

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # nginx/mockmate.conf is the EC2 host's nginx (frontend/nginx.conf is the container image's, for k8s)
      - name: Copy nginx config
        run: |
          scp -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no nginx/mockmate.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/mockmate.conf

      - name: Deploy backend container
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          SSH="ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          # token goes over stdin, never on the remote command line; it expires when this job ends
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # Email login for help/review messages, also over stdin, replacing any SMTP lines in the server .env.
          # Only SMTP_PASSWORD set = Gmail app password; add SMTP_HOST + SMTP_USER secrets for a relay such as Brevo.
          if [ -n "$SMTP_PASSWORD" ]; then
            printf '%s\n' "SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}" "SMTP_PORT=587" "SMTP_USER=${SMTP_USER:-mockmate.site@gmail.com}" \
                "SMTP_FROM=mockmate.site@gmail.com" "SMTP_PASSWORD=${SMTP_PASSWORD// /}" \
              | $SSH 'cd ~/MockMate && { grep -vE "^SMTP_(HOST|PORT|USER|FROM|PASSWORD)=" .env; cat; } > .env.new && chmod 600 .env.new && mv .env.new .env'
            echo "==> SMTP settings written to the server .env"
          fi
          $SSH "IMAGE=$IMAGE bash -s" << 'ENDSSH'
          set -e
          cd ~/MockMate

          # certbot rewrites the nginx config once SSL is on; only install ours before that
          if [ ! -f /etc/letsencrypt/live/*/fullchain.pem ]; then
            sudo cp /tmp/mockmate.conf /etc/nginx/conf.d/mockmate.conf
          fi
          sudo nginx -t

          # 8 GB disk can't fit the new image next to old leftovers; images the current container uses are kept, so rollback still works
          docker image prune -af >/dev/null
          docker builder prune -af >/dev/null 2>&1 || true
          # The outgoing container's log goes when it is replaced anyway; empty it now so the pull has room
          # (a months-long crash loop left 1.8 GB there). Keep the journal's last 100 MB.
          OLD_LOG=$(docker inspect --format '{{.LogPath}}' mockmate 2>/dev/null || true)
          if [ -n "$OLD_LOG" ]; then sudo truncate -s 0 "$OLD_LOG"; fi
          sudo journalctl --vacuum-size=100M >/dev/null 2>&1 || true
          echo "==> Free before pull: $(df -h / | awk 'NR==2 {print $4}')"

          echo "==> Pulling $IMAGE"
          docker pull "$IMAGE"
          docker logout ghcr.io

          PREV=$(docker inspect --format '{{.Config.Image}}' mockmate 2>/dev/null || true)
          # backend/.env holds the DB, Gemini and JWT settings; old server-built images had it baked in at /app/.env.
          # Mounting it at the same path makes every module resolve settings exactly as the old deploy did.
          # The image runs as uid 10001, which may not be able to read ec2-user's file: hand it a 0400 copy it owns
          # (refreshed every deploy; root in the old image can still read it on a rollback).
          ENV_MOUNT=""
          if [ -f backend/.env ]; then
            sudo install -m 0400 -o 10001 -g 10001 backend/.env backend/.env.container
            ENV_MOUNT="-v $HOME/MockMate/backend/.env.container:/app/.env:ro"
          fi
          # logs capped at 3 x 20 MB so a crash loop can never fill the disk again
          run() { docker run -d --name mockmate --env-file .env $ENV_MOUNT --log-opt max-size=20m --log-opt max-file=3 \
                    -p 8000:8000 --restart unless-stopped "$1"; }
          healthy() {
            for i in $(seq 1 15); do
              curl -sf localhost:8000/health | grep -q '"ok"' && return 0
              sleep 5
            done
            return 1
          }

          docker rm -f mockmate 2>/dev/null || true
          run "$IMAGE"
          if ! healthy; then
            echo "ERROR: new image unhealthy"
            docker logs mockmate --tail 50
            docker rm -f mockmate
            if [ -n "$PREV" ]; then
              run "$PREV"
              healthy && echo "Rolled back to $PREV"
            fi
            exit 1
          fi

          docker image prune -af   # old images stay in GHCR, re-pull by SHA to roll back by hand
          sudo systemctl reload nginx
          echo "==> Deployed $IMAGE"
          ENDSSH

      # only once the new backend is healthy, so a failed deploy never leaves a new frontend on an old API
      - name: Sync frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no" frontend/dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/MockMate/frontend/dist/

      - name: Smoke test
        run: |
          curl -sf http://${{ secrets.EC2_HOST }}/health | grep -q '"ok"'
          [ "$(curl -so /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }}/)" = "200" ]
          curl -sf http://${{ secrets.EC2_HOST }}/rubric/health | grep -q '"ok"'

      - name: Summary
        if: always()
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | http://${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
