{{- if .Values.ingress.enabled }}
# API path prefixes go to the api Service, everything else to the frontend (same split the EC2 nginx did).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "mockmate.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ required "ingress.host is required with TLS" .Values.ingress.host | quote }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.ingress.apiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend: {service: {name: {{ $.Release.Name }}-api, port: {name: http}}}
          {{- end }}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-frontend, port: {name: http}}}
{{- end }}
