# Consumes the Redis evaluation queue. Same image as the api, different command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eval-worker
  labels:
    {{- include "mockmate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels:
        {{- include "mockmate.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # On rollout, give an in-flight evaluation time to finish (arq waits for running jobs on SIGTERM).
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [arq, services.evaluation.queue.WorkerSettings]
          ports: [{name: metrics, containerPort: 9100}]
          envFrom: {{- include "mockmate.envFrom" . | nindent 12 }}
          env:
            # The worker isn't the API process, so it reaches the interview service over the cluster network.
            - {name: INTERVIEW_SERVICE_URL, value: "http://{{ .Release.Name }}-api:8000/interviews"}
          # Metrics are served from a side thread, so this stays up while a job blocks the event loop.
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "mockmate.securityContext" . | nindent 12 }}
