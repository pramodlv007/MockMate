{{- if .Values.certManager.createClusterIssuer }}
# Let's Encrypt via HTTP-01: cert-manager answers the challenge on port 80 through Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.tls.clusterIssuer }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ required "certManager.email is required for Let's Encrypt" .Values.certManager.email }}
    privateKeySecretRef: {name: {{ .Values.ingress.tls.clusterIssuer }}-account}
    solvers:
      - http01:
          ingress: {ingressClassName: {{ .Values.ingress.className }}}
{{- end }}
