server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed build assets never change; cache them hard. index.html must stay fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # SPA: client-side routes fall back to index.html
    }
}
